services:
  db:
    image: postgres:16-alpine
    container_name: quimica_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quimica
      POSTGRES_PASSWORD: quimica123
      POSTGRES_DB: quimica
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quimica"]
      interval: 3s
      retries: 10

  servidor:
    build: ./servidor
    container_name: quimica_servidor
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PUERTO: "7777"
      DATABASE_URL: postgresql://quimica:quimica123@db:5432/quimica
    ports:
      - "7777:7777"

  # Panel web para inspeccionar la BD. Va en el perfil "admin" para que la demo
  # normal (docker compose up) no lo arranque: no hace falta para jugar y suma
  # otra imagen pesada a descargar.
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: quimica_pgadmin
    restart: unless-stopped
    profiles: ["admin"]
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      # Solo en 127.0.0.1: las credenciales son de demo, no debe verse desde la red
      - "127.0.0.1:5050:80"
    volumes:
      # Guarda los servidores registrados y las preferencias entre reinicios
      - datos_pgadmin:/var/lib/pgadmin

volumes:
  datos_db:
  datos_pgadmin:
