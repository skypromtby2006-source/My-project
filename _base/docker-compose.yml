services:
  db:
    image: postgres:16-alpine
    container_name: quimica_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quimica
      POSTGRES_PASSWORD: quimica123
      POSTGRES_DB: quimica
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quimica"]
      interval: 3s
      retries: 10

  servidor:
    build: ./servidor
    container_name: quimica_servidor
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PUERTO: "7777"
      DATABASE_URL: postgresql://quimica:quimica123@db:5432/quimica
    ports:
      - "7777:7777"

volumes:
  datos_db:
