<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box;font-family:Manrope,system-ui,sans-serif}
.btn{border:0;border-radius:12px;padding:0 24px;height:52px;font-weight:800;font-size:18px;color:#fff;background:#7c3aed;cursor:pointer}
.btn.sec{background:#2a2050;color:#f3efff;border:1px solid #4a3a8a}
.btn.sm{height:44px;font-size:16px;padding:0 18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:#1a1433;border:1px solid #3a2d6b;border-radius:16px}
.lbl{font-size:15px;color:#b8aedd;font-weight:600}
.inp{height:52px;border-radius:12px;border:1px solid #4a3a8a;background:#0e0a1f;color:#f3efff;padding:0 16px;font-size:18px;width:100%}
.chip{display:inline-block;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:800;background:#2a2050;color:#d8ccff}
.ok{background:#123b36;color:#5eead4}.warn{background:#3a2d12;color:#fbbf24}.host{background:#3b2a7a;color:#d8ccff}
.row{display:flex;align-items:center;gap:14px}
</style>
</helmet>
<div style="width:1280px;height:720px;background:#0e0a1f;color:#f3efff;padding:48px 64px;display:flex;flex-direction:column;gap:28px">
<div class="row" style="justify-content:space-between"><div><div class="lbl">Sala · PvP</div><h1 style="margin:0;font-size:40px">Sala de prueba</h1></div>
<div class="row"><div class="lbl">Código</div><span style="font-weight:800;font-size:36px;letter-spacing:.2em;background:#1a1433;border:1px solid #3a2d6b;border-radius:12px;padding:6px 20px">EQAKK</span></div></div>
<div class="row" style="align-items:stretch;gap:28px;flex:1">
<div class="card" style="flex:1;padding:24px"><h2 style="margin:0 0 8px;font-size:24px">Equipo A</h2><div class="row" style="padding:10px 0"><div style="width:48px;height:48px;border-radius:50%;background:#3b2a7a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px">D</div><div style="flex:1;font-weight:800;font-size:20px">DM</div><span class="chip host">Host</span><span class="chip ok">Listo</span></div><div class="row" style="padding:10px 0"><div style="width:48px;height:48px;border-radius:50%;background:#3b2a7a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px">J</div><div style="flex:1;font-weight:800;font-size:20px">Jugador 1</div><span class="chip ok">Listo</span><button class="btn sm sec">Expulsar</button></div></div>
<div class="card" style="flex:1;padding:24px"><h2 style="margin:0 0 8px;font-size:24px">Equipo B</h2><div class="row" style="padding:10px 0"><div style="width:48px;height:48px;border-radius:50%;background:#3b2a7a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px">J</div><div style="flex:1;font-weight:800;font-size:20px">Jugador 2</div><span class="chip warn">No listo</span><button class="btn sm sec">Expulsar</button></div></div></div>
<div class="row"><span class="chip warn" style="font-size:16px">Faltan jugadores por marcarse como listos</span></div>
<div class="row"><button class="btn sec">Salir de la sala</button><div style="flex:1"></div><button class="btn sec">Cambiar de equipo</button><button class="btn sec">Estoy listo</button><button class="btn" disabled>Iniciar partida</button></div></div>
</x-dc>
